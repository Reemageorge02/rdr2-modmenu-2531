<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#1b140f"/>
  
  <!-- Weathered horseshoe fused with six-shooter cylinder -->
  <g transform="translate(128,128)">
    
    <!-- Outer brand stamp ring - rough/cropped -->
    <path d="M -92,-18 L -88,-52 L -72,-78 L -48,-96 L -18,-104 L 14,-104 L 46,-94 L 72,-76 L 88,-52 L 94,-18 L 94,18 L 86,52 L 68,78 L 42,96 L 12,104 L -20,104 L -50,94 L -72,76 L -88,50 Z" 
          fill="none" stroke="#b5462f" stroke-width="4" stroke-linejoin="miter"/>
    
    <!-- Inner engraving border with grit -->
    <path d="M -76,-14 L -72,-42 L -58,-64 L -38,-80 L -12,-88 L 12,-88 L 38,-80 L 58,-62 L 72,-42 L 78,-14 L 78,14 L 70,44 L 54,64 L 32,80 L 8,88 L -16,88 L -42,78 L -60,60 L -72,40 Z" 
          fill="none" stroke="#d9a441" stroke-width="2.5" stroke-dasharray="6 3"/>
    
    <!-- Horseshoe: U-shape fused with cylinder body -->
    <path d="M -58,-52 
             L -58,20 
             Q -58,68 -10,68 
             Q 38,68 38,20 
             L 38,-52
             L 22,-52
             L 22,20
             Q 22,48 -10,48
             Q -42,48 -42,20
             L -42,-52 Z" 
          fill="#e8dcc3"/>
    
    <!-- Horseshoe nail holes - tactile punch marks -->
    <circle cx="-50" cy="-36" r="3.5" fill="#1b140f"/>
    <circle cx="-50" cy="-8" r="3.5" fill="#1b140f"/>
    <circle cx="-50" cy="20" r="3.5" fill="#1b140f"/>
    <circle cx="30" cy="-36" r="3.5" fill="#1b140f"/>
    <circle cx="30" cy="-8" r="3.5" fill="#1b140f"/>
    <circle cx="30" cy="20" r="3.5" fill="#1b140f"/>
    
    <!-- Cylinder overlay: six-shooter cylinder fused into horseshoe curve -->
    <g transform="translate(0, 34)">
      <!-- Cylinder body -->
      <circle cx="0" cy="0" r="30" fill="#d9a441" stroke="#1b140f" stroke-width="3"/>
      <!-- Cylinder inner ring -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#1b140f" stroke-width="2.5"/>
      <!-- Central pin -->
      <circle cx="0" cy="0" r="6" fill="#b5462f" stroke="#1b140f" stroke-width="2"/>
      
      <!-- Six chambers -->
      <circle cx="0" cy="-16" r="5" fill="#1b140f"/>
      <circle cx="14" cy="-8" r="5" fill="#1b140f"/>
      <circle cx="14" cy="8" r="5" fill="#1b140f"/>
      <circle cx="0" cy="16" r="5" fill="#1b140f"/>
      <circle cx="-14" cy="8" r="5" fill="#1b140f"/>
      <circle cx="-14" cy="-8" r="5" fill="#1b140f"/>
      
      <!-- Chamber engraving ticks -->
      <line x1="0" y1="-26" x2="0" y2="-22" stroke="#1b140f" stroke-width="1.8"/>
      <line x1="22" y1="-13" x2="19" y2="-11" stroke="#1b140f" stroke-width="1.8"/>
      <line x1="22" y1="13" x2="19" y2="11" stroke="#1b140f" stroke-width="1.8"/>
      <line x1="0" y1="26" x2="0" y2="22" stroke="#1b140f" stroke-width="1.8"/>
      <line x1="-22" y1="13" x2="-19" y2="11" stroke="#1b140f" stroke-width="1.8"/>
      <line x1="-22" y1="-13" x2="-19" y2="-11" stroke="#1b140f" stroke-width="1.8"/>
    </g>
    
    <!-- Six-shooter barrel stub protruding from cylinder top-left -->
    <path d="M -34,20 L -26,12 L -20,12 L -20,20 L -26,20 Z" fill="#b5462f"/>
    
    <!-- Hammer spur at top-right -->
    <path d="M 30,4 L 40,-4 L 44,0 L 38,8 Z" fill="#b5462f"/>
    
    <!-- Brand stamp texture marks - rough engraving lines -->
    <path d="M -70,-60 L -64,-56 M 64,-56 L 70,-60 M 76,-30 L 70,-26 M -70,-30 L -76,-26" 
          stroke="#e8dcc3" stroke-width="1.5" stroke-linecap="square"/>
    
    <!-- Small twilight campfire accent dot top -->
    <circle cx="0" cy="-94" r="4" fill="#b5462f"/>
    <path d="M -6,-96 L 0,-104 L 6,-96 Z" fill="#d9a441"/>
    
    <!-- Bottom terminal/UI precision tick marks -->
    <line x1="-30" y1="98" x2="-18" y2="98" stroke="#d9a441" stroke-width="2"/>
    <line x1="-8" y1="98" x2="8" y2="98" stroke="#e8dcc3" stroke-width="2"/>
    <line x1="18" y1="98" x2="30" y2="98" stroke="#d9a441" stroke-width="2"/>
  </g>
</svg>
